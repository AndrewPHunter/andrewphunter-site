{{ define "main" }}
{{ $pages := sort .Pages "Params.part" }}

<div class="section-index">
  <header class="section-page-header">
    <span class="section-page-kicker">Series</span>
    <h1 class="section-page-title">{{ .Title }}</h1>
    <div class="section-page-desc">{{ len $pages }} parts. Read in order.</div>
  </header>

  <div class="essay-grid">
    {{ range $pages }}
      {{ partial "essay-card.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
