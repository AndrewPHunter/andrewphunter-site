<header class="masthead">
  <div class="masthead-inner">
    <a href="{{ .Site.BaseURL }}" class="site-name">
      Andrew Hunter
    </a>
    <button class="nav-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}"
         {{- if or (eq .URL $.RelPermalink) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }} class="active" aria-current="page"{{ end }}>
        {{ .Name }}
      </a>
      {{ end }}
    </nav>
  </div>
</header>

<script>
(function() {
  var btn = document.querySelector('.nav-toggle');
  var header = document.querySelector('.masthead');
  if (!btn || !header) return;
  header.classList.add('nav-ready');
  btn.addEventListener('click', function() {
    var open = header.classList.toggle('nav-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.textContent = open ? 'Close' : 'Menu';
    btn.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  });
  header.addEventListener('keydown', function(event) {
    if (event.key === 'Escape' && header.classList.contains('nav-open')) {
      btn.click();
      btn.focus();
    }
  });
})();
</script>
