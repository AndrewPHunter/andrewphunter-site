{{ define "main" }}
<div class="simple-page" style="text-align: center; padding-top: var(--space-20);">
  <div style="font-family: var(--font-mono); font-size: 5rem; font-weight: 300; color: var(--rule); line-height: 1; margin-bottom: var(--space-5);">404</div>
  <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 500; margin-bottom: var(--space-5);">Page not found</h1>
  <p style="color: var(--muted); font-style: italic; margin-bottom: var(--space-8);">The page you requested doesn't exist or has moved.</p>
  <a href="/" style="font-family: var(--font-mono); font-size: var(--text-sm); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); text-decoration: none;">← Return home</a>
</div>
{{ end }}
