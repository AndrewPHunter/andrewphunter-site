<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc">
<title id="title">Different responsibilities, different models</title>
<desc id="desc">The planner develops the design with Andy. The architect turns the plan into headers and invariants, supported by Sonnet research. Human approval precedes Opus implementation and verification. A separate Fable reviewer reports findings; Opus corrects and re-runs checks before human acceptance.</desc>
<rect width="1200" height="1250" fill="#fafaf5"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#53606c" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0e1524}.heading{font-family:Georgia,serif;font-size:43px}.label{font-size:28px;font-weight:600}.body{font-size:24px}.small{font-size:22px;fill:#53606c}.kicker{font-family:monospace;font-size:21px;letter-spacing:2px;fill:#a57c2e}</style>
<text x="60" y="58" class="kicker">ARCHITECTING WITH CLAUDE</text>
<text x="60" y="117" class="heading">Different responsibilities, different models</text>
<text x="60" y="160" class="body">The plan starts /architect in a separate execution thread.</text>
<rect x="60" y="210" width="680" height="110" rx="3" fill="#e4ebe3"/>
<text x="85" y="244" class="label">Planner</text>
<text x="85" y="275" class="small">Fable / chosen frontier model</text>
<text x="85" y="304" class="small">Develop the design with me.</text>
<path d="M400 320 V345" fill="none" stroke="#53606c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="350" width="680" height="110" rx="3" fill="#e4ebe3"/>
<text x="85" y="384" class="label">Architect</text>
<text x="85" y="415" class="small">Fable / chosen frontier model</text>
<text x="85" y="444" class="small">Turn the plan into headers and invariants.</text>
<path d="M400 460 V485" fill="none" stroke="#53606c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="490" width="680" height="110" rx="3" fill="#0e1524"/>
<text x="85" y="524" class="label" style="fill:#fafaf5">My contract review</text>
<text x="85" y="566" class="body" style="fill:#fafaf5">Review the headers, checks, and omissions.</text>
<path d="M400 600 V625" fill="none" stroke="#53606c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="630" width="680" height="110" rx="3" fill="#e4ebe3"/>
<text x="85" y="664" class="label">Implementer</text>
<text x="85" y="695" class="small">Opus</text>
<text x="85" y="724" class="small">Implement the contracts and run the checks.</text>
<path d="M400 740 V765" fill="none" stroke="#53606c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="770" width="680" height="110" rx="3" fill="#e4ebe3"/>
<text x="85" y="804" class="label">Reviewer</text>
<text x="85" y="835" class="small">Fable · separate context</text>
<text x="85" y="864" class="small">Report findings against contracts and evidence.</text>
<path d="M400 880 V905" fill="none" stroke="#53606c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="910" width="680" height="110" rx="3" fill="#e4ebe3"/>
<text x="85" y="944" class="label">Correction pass</text>
<text x="85" y="975" class="small">Opus</text>
<text x="85" y="1004" class="small">Address findings; re-run checks; report open work.</text>
<path d="M400 1020 V1045" fill="none" stroke="#53606c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="1050" width="680" height="110" rx="3" fill="#0e1524"/>
<text x="85" y="1084" class="label" style="fill:#fafaf5">My acceptance decision</text>
<text x="85" y="1126" class="body" style="fill:#fafaf5">Judge the result and unresolved findings.</text>
<text x="805" y="240" class="label">Design first</text>
<text x="805" y="280" class="small">Responsibilities, constraints,</text>
<text x="805" y="311" class="small">dependencies, and tradeoffs.</text>
<rect x="795" y="350" width="345" height="144" fill="#f0e7d4"/>
<text x="815" y="385" class="label">Researcher</text>
<text x="815" y="418" class="small">Sonnet</text>
<text x="815" y="453" class="small">Bounded source questions.</text>
<text x="815" y="480" class="small">Returns cited evidence.</text>
<path d="M795 405 H745" fill="none" stroke="#53606c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="805" y="590" class="label">Contract changes</text>
<text x="805" y="630" class="small">Return for a decision.</text>
<text x="805" y="661" class="small">Do not silently revise</text>
<text x="805" y="692" class="small">the agreed interface.</text>
<path d="M740 681 H770 V545 H745" fill="none" stroke="#53606c" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text x="805" y="840" class="label">Review is a role</text>
<text x="805" y="880" class="small">Its output is findings,</text>
<text x="805" y="911" class="small">not permission to merge.</text>
<path d="M60 1190 H1140" stroke="#cbd0cc"/>
<text x="60" y="1228" class="small">Apply model capacity to the work, with explicit outputs at each handoff.</text>
</svg>