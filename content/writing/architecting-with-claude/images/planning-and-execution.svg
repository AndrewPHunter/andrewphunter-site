<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="title desc">
<title id="title">Planning continues while work runs</title>
<desc id="desc">Research, visualization, and cooperative iteration produce plans with explicit dependencies. Ready plans A and B start separate architect workflow threads and worktrees. Plan C waits for its dependencies. Each execution thread carries work through headers, contract review, implementation, verification, and review. Design-changing questions return to planning.</desc>
