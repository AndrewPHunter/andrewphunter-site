<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Instructions and enforcement</title><desc id="desc">Instructions describe the intended work. Permissions and sandboxing restrict access. Hooks trigger checks at lifecycle events. Required CI and branch protection control merging. These mechanisms have different responsibilities.</desc>
<rect width="1200" height="980" fill="#fafaf5"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#53606c" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0e1524}.heading{font-family:Georgia,serif;font-size:44px}.label{font-size:28px;font-weight:600}.body{font-size:25px}.small{font-size:22px;fill:#53606c}.kicker{font-family:monospace;font-size:21px;letter-spacing:2px;fill:#b58a35}</style>
<text x="60" y="60" class="kicker">ARCHITECTING WITH CLAUDE</text>
<text x="60" y="120" class="heading">What carries the rule?</text>
<text x="60" y="164" class="body">Choose the mechanism for the job it actually performs.</text>
<path d="M60 200 H1140" stroke="#cbd0cc"/>
<text x="60" y="243" class="kicker">01</text>
<text x="120" y="243" class="label">Instructions</text>
<text x="120" y="285" class="small">CLAUDE.md · AGENTS.md · skills</text>
<text x="610" y="243" class="body">Explain how to work.</text>
<text x="610" y="285" class="small">The model interprets and follows them.</text>
<path d="M60 365 H1140" stroke="#cbd0cc"/>
<text x="60" y="408" class="kicker">02</text>
<text x="120" y="408" class="label">Access controls</text>
<text x="120" y="450" class="small">Permissions · sandbox</text>
<text x="610" y="408" class="body">Restrict tools, files, and network access.</text>
<text x="610" y="450" class="small">The configured boundary determines coverage.</text>
<path d="M60 530 H1140" stroke="#cbd0cc"/>
<text x="60" y="573" class="kicker">03</text>
<text x="120" y="573" class="label">Lifecycle hooks</text>
<text x="120" y="615" class="small">Before tools · after edits · on stop</text>
<text x="610" y="573" class="body">Invoke checks at a defined event.</text>
<text x="610" y="615" class="small">The check decides what it can establish.</text>
<path d="M60 695 H1140" stroke="#cbd0cc"/>
<text x="60" y="738" class="kicker">04</text>
<text x="120" y="738" class="label">Merge gates</text>
<text x="120" y="780" class="small">Required CI · branch protection</text>
<text x="610" y="738" class="body">Hold changes at the shared branch.</text>
<text x="610" y="780" class="small">Acceptance depends on the configured checks.</text>
<rect x="60" y="873" width="1080" height="64" fill="#0e1524"/>
<text x="83" y="914" class="body" style="fill:#fafaf5">A workflow instruction does not, by itself, prevent an action.</text>
</svg>