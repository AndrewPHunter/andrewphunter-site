<rect x="110" y="256" width="115" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="167.5" y="291.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">2</text>
<path d="M242,283 L288,283" stroke="#536475" stroke-width="2" fill="none"/>
<path d="M280,278 L288,283 L280,288" fill="none" stroke="#536475" stroke-width="2"/>
