<text x="395.0" y="366.5" font-size="25" fill="#a74d34" text-anchor="middle" font-weight="700">20.0855</text>
<path d="M498,358 L561,358" stroke="#536475" stroke-width="2" fill="none"/>
<path d="M553,353 L561,358 L553,363" fill="none" stroke="#536475" stroke-width="2"/>
<text x="585" y="365" font-size="26" fill="#a74d34" text-anchor="start" font-weight="700">0.6652</text>
<rect x="692" y="340" width="170" height="36" rx="7" fill="#e4e8e6" stroke="#e4e8e6" stroke-width="1.5"/>
<rect x="692" y="340" width="113.09097" height="36" rx="7" fill="#a74d34" stroke="#a74d34" stroke-width="1.5"/>
<rect x="310" y="423" width="200" height="59" rx="7" fill="#172f46" stroke="#172f46" stroke-width="1.5"/>
<text x="410" y="460" font-size="22" fill="#fbf8f0" text-anchor="middle" font-weight="700">Total ≈ 30.1929</text>
<rect x="568" y="423" width="294" height="59" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="715" y="460" font-size="22" fill="#167779" text-anchor="middle" font-weight="700">Probabilities sum to 1</text>
</g></svg>
