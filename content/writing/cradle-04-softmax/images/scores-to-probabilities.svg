<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">From logits to probabilities</title><desc id="desc">For candidate tokens A, B and C, exponentiate scores 1,2,3, then divide by their total of about 30.1929. The probabilities are approximately .0900,.2447,.6652. Bars share a scale. Displayed numbers are rounded.</desc>
<rect width="900" height="520" rx="8" fill="#fbf8f0"/>
<g font-family="IBM Plex Sans, Arial, sans-serif">
<text x="32" y="44" font-size="28" fill="#172f46" text-anchor="start" font-weight="700">From logits to probabilities</text>
<text x="32" y="82" font-size="20" fill="#536475" text-anchor="start" font-weight="400">Three candidate tokens; all decimal values below are rounded.</text>
<text x="110" y="126" font-size="23" fill="#172f46" text-anchor="start" font-weight="700">Logit</text>
<text x="110" y="155" font-size="19" fill="#536475" text-anchor="start" font-weight="400">raw input</text>
<text x="310" y="126" font-size="23" fill="#172f46" text-anchor="start" font-weight="700">Exponential</text>
<text x="310" y="155" font-size="19" fill="#536475" text-anchor="start" font-weight="400">MathF.Exp(logit)</text>
<text x="585" y="126" font-size="23" fill="#172f46" text-anchor="start" font-weight="700">Probability</text>
<text x="585" y="155" font-size="19" fill="#536475" text-anchor="start" font-weight="400">exponential ÷ total</text>
<text x="44" y="217" font-size="25" fill="#9b7028" text-anchor="start" font-weight="700">A</text>
<rect x="110" y="181" width="115" height="54" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="167.5" y="216.84" font-size="26" fill="#9b7028" text-anchor="middle" font-weight="700">1</text>
<path d="M242,208 L288,208" stroke="#536475" stroke-width="2" fill="none"/>
<path d="M280,203 L288,208 L280,213" fill="none" stroke="#536475" stroke-width="2"/>
<rect x="310" y="181" width="170" height="54" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="395.0" y="216.5" font-size="25" fill="#9b7028" text-anchor="middle" font-weight="700">2.7183</text>
<path d="M498,208 L561,208" stroke="#536475" stroke-width="2" fill="none"/>
<path d="M553,203 L561,208 L553,213" fill="none" stroke="#536475" stroke-width="2"/>
<text x="585" y="215" font-size="26" fill="#9b7028" text-anchor="start" font-weight="700">0.0900</text>
<rect x="692" y="190" width="170" height="36" rx="7" fill="#e4e8e6" stroke="#e4e8e6" stroke-width="1.5"/>
<rect x="692" y="190" width="15.305202" height="36" rx="7" fill="#9b7028" stroke="#9b7028" stroke-width="1.5"/>
