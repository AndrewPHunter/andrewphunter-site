<path d="M553,278 L561,283 L553,288" fill="none" stroke="#536475" stroke-width="2"/>
<text x="585" y="290" font-size="26" fill="#167779" text-anchor="start" font-weight="700">0.2447</text>
<rect x="692" y="265" width="170" height="36" rx="7" fill="#e4e8e6" stroke="#e4e8e6" stroke-width="1.5"/>
<rect x="692" y="265" width="41.603845" height="36" rx="7" fill="#167779" stroke="#167779" stroke-width="1.5"/>
<text x="44" y="367" font-size="25" fill="#a74d34" text-anchor="start" font-weight="700">C</text>
