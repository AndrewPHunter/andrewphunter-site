<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">Same score gaps, manageable exponentials</title><desc id="desc">Direct exponentiation of 1000,1001,1002 overflows float. Subtracting maximum 1002 gives -2,-1,0, whose exponentials are about .1353,.3679,1. Their sum is about 1.5032 and their normalized probabilities are .0900,.2447,.6652.</desc>
<rect width="900" height="610" rx="8" fill="#fbf8f0"/>
<g font-family="IBM Plex Sans, Arial, sans-serif">
<text x="32" y="44" font-size="28" fill="#172f46" text-anchor="start" font-weight="700">Same score gaps, manageable exponentials</text>
<text x="34" y="83" font-size="21" fill="#a74d34" text-anchor="start" font-weight="700">DIRECT CALCULATION</text>
<rect x="34" y="106" width="115" height="54" rx="7" fill="#f4ded4" stroke="#a74d34" stroke-width="1.5"/>
<text x="91.5" y="141.84" font-size="26" fill="#a74d34" text-anchor="middle" font-weight="700">1000</text>
<rect x="159" y="106" width="115" height="54" rx="7" fill="#f4ded4" stroke="#a74d34" stroke-width="1.5"/>
<text x="216.5" y="141.84" font-size="26" fill="#a74d34" text-anchor="middle" font-weight="700">1001</text>
<rect x="284" y="106" width="115" height="54" rx="7" fill="#f4ded4" stroke="#a74d34" stroke-width="1.5"/>
<text x="341.5" y="141.84" font-size="26" fill="#a74d34" text-anchor="middle" font-weight="700">1002</text>
<path d="M421,134 L461,134" stroke="#a74d34" stroke-width="2" fill="none"/>
<path d="M453,129 L461,134 L453,139" fill="none" stroke="#a74d34" stroke-width="2"/>
<rect x="477" y="106" width="160" height="54" rx="7" fill="#f4ded4" stroke="#a74d34" stroke-width="1.5"/>
<text x="557" y="141" font-size="25" fill="#a74d34" text-anchor="middle" font-weight="700">exp → ∞</text>
<path d="M650,134 L690,134" stroke="#a74d34" stroke-width="2" fill="none"/>
<path d="M682,129 L690,134 L682,139" fill="none" stroke="#a74d34" stroke-width="2"/>
<rect x="706" y="106" width="156" height="54" rx="7" fill="#f4ded4" stroke="#a74d34" stroke-width="1.5"/>
<text x="784" y="141" font-size="25" fill="#a74d34" text-anchor="middle" font-weight="700">∞ ÷ ∞</text>
<text x="706" y="198" font-size="23" fill="#a74d34" text-anchor="start" font-weight="700">Result: NaN</text>
<path d="M34,225 L862,225" stroke="#c7cdd0" stroke-width="2" fill="none"/>
<text x="34" y="266" font-size="21" fill="#167779" text-anchor="start" font-weight="700">SUBTRACT THE SAME MAXIMUM FROM EVERY SCORE</text>
<rect x="34" y="290" width="115" height="54" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="91.5" y="325.84" font-size="26" fill="#9b7028" text-anchor="middle" font-weight="700">1000</text>
<rect x="159" y="290" width="115" height="54" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="216.5" y="325.84" font-size="26" fill="#9b7028" text-anchor="middle" font-weight="700">1001</text>
<rect x="284" y="290" width="115" height="54" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="341.5" y="325.84" font-size="26" fill="#9b7028" text-anchor="middle" font-weight="700">1002</text>
<path d="M419,317 L480,317" stroke="#536475" stroke-width="2" fill="none"/>
<path d="M472,312 L480,317 L472,322" fill="none" stroke="#536475" stroke-width="2"/>
<text x="450" y="365" font-size="21" fill="#536475" text-anchor="middle" font-weight="700">−1002</text>
<rect x="495" y="290" width="115" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="552.5" y="325.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">−2</text>
<rect x="620" y="290" width="115" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="677.5" y="325.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">−1</text>
<rect x="745" y="290" width="115" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="802.5" y="325.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">0</text>
<text x="34" y="414" font-size="22" fill="#172f46" text-anchor="start" font-weight="700">Exponentials</text>
<rect x="300" y="382" width="120" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="360.0" y="417.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">0.1353</text>
<rect x="430" y="382" width="120" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="490.0" y="417.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">0.3679</text>
<rect x="560" y="382" width="120" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="620.0" y="417.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">1</text>
<text x="714" y="415" font-size="20" fill="#167779" text-anchor="start" font-weight="700">sum ≈ 1.5032</text>
<text x="34" y="495" font-size="22" fill="#172f46" text-anchor="start" font-weight="700">Divide by the sum</text>
<rect x="300" y="463" width="120" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="360.0" y="498.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">0.0900</text>
<rect x="430" y="463" width="120" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="490.0" y="498.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">0.2447</text>
<rect x="560" y="463" width="120" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="620.0" y="498.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">0.6652</text>
<rect x="34" y="543" width="828" height="42" rx="7" fill="#172f46" stroke="#172f46" stroke-width="1.5"/>
<text x="448" y="571" font-size="23" fill="#fbf8f0" text-anchor="middle" font-weight="400">Same probabilities as [1, 2, 3]. No enormous exponentials.</text>
</g></svg>
