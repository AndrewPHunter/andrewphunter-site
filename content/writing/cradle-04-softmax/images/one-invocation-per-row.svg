<rect x="290" y="314" width="108" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="344.0" y="349.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">3</text>
<text x="52" y="407" font-size="21" fill="#172f46" text-anchor="start" font-weight="700">Pass 1: exponentiate and add</text>
<rect x="54" y="425" width="108" height="44" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="108.0" y="454.48" font-size="22" fill="#167779" text-anchor="middle" font-weight="700">2.718</text>
<rect x="172" y="425" width="108" height="44" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="226.0" y="454.48" font-size="22" fill="#167779" text-anchor="middle" font-weight="700">7.389</text>
