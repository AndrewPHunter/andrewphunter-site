<text x="488" y="263" font-size="21" fill="#536475" text-anchor="start" font-weight="400">offset = 1 × 3 = 3</text>
<text x="540" y="301" font-size="18" fill="#536475" text-anchor="middle" font-weight="400">index 3</text>
