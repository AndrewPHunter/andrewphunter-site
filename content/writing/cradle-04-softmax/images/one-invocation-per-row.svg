<text x="544.0" y="454.48" font-size="22" fill="#9b7028" text-anchor="middle" font-weight="700">1</text>
<rect x="608" y="425" width="108" height="44" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="662.0" y="454.48" font-size="22" fill="#9b7028" text-anchor="middle" font-weight="700">1</text>
