<text x="780.0" y="454.48" font-size="22" fill="#9b7028" text-anchor="middle" font-weight="700">1</text>
<text x="488" y="502" font-size="22" fill="#9b7028" text-anchor="start" font-weight="700">This row’s sum ≈ 3</text>
<text x="488" y="540" font-size="21" fill="#172f46" text-anchor="start" font-weight="700">Pass 2: divide by this sum</text>
<rect x="490" y="555" width="108" height="44" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="544.0" y="584.48" font-size="22" fill="#9b7028" text-anchor="middle" font-weight="700">⅓</text>
<rect x="608" y="555" width="108" height="44" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="662.0" y="584.48" font-size="22" fill="#9b7028" text-anchor="middle" font-weight="700">⅓</text>
<rect x="726" y="555" width="108" height="44" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="780.0" y="584.48" font-size="22" fill="#9b7028" text-anchor="middle" font-weight="700">⅓</text>
<text x="450" y="657" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Each job writes back to its own three output positions.</text>
<text x="450" y="685" font-size="19" fill="#536475" text-anchor="middle" font-weight="400">The GPU schedules these jobs; their execution order does not matter.</text>
</g></svg>
