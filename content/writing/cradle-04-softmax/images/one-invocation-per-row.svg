<text x="52" y="230" font-size="24" fill="#167779" text-anchor="start" font-weight="700">Invocation: row = 0</text>
<text x="52" y="263" font-size="21" fill="#536475" text-anchor="start" font-weight="400">offset = 0 × 3 = 0</text>
<text x="104" y="301" font-size="18" fill="#536475" text-anchor="middle" font-weight="400">index 0</text>
<text x="222" y="301" font-size="18" fill="#536475" text-anchor="middle" font-weight="400">index 1</text>
<text x="340" y="301" font-size="18" fill="#536475" text-anchor="middle" font-weight="400">index 2</text>
<rect x="54" y="314" width="108" height="54" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="108.0" y="349.84" font-size="26" fill="#167779" text-anchor="middle" font-weight="700">1</text>
