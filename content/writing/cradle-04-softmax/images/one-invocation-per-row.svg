<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">Two rows, two independent GPU jobs</title><desc id="desc">A one-dimensional launch of size 2 gives one invocation per row. The first row reads input positions 0,1,2 and the second reads 3,4,5. Each computes its own sum and normalizes its own row. The two output ranges do not overlap; invocation scheduling order is unspecified.</desc>
<rect width="900" height="700" rx="8" fill="#fbf8f0"/>
<g font-family="IBM Plex Sans, Arial, sans-serif">
<text x="32" y="44" font-size="28" fill="#172f46" text-anchor="start" font-weight="700">Two rows, two independent GPU jobs</text>
<rect x="185" y="79" width="530" height="62" rx="7" fill="#172f46" stroke="#172f46" stroke-width="1.5"/>
<text x="450" y="119" font-size="25" fill="#fbf8f0" text-anchor="middle" font-weight="700">CPU: Launch(new Index1D(2), …)</text>
<path d="M450,141 L450,160" stroke="#c7cdd0" stroke-width="2" fill="none"/>
<path d="M235,160 L665,160" stroke="#c7cdd0" stroke-width="2" fill="none"/>
<path d="M235,160 L235,187" stroke="#536475" stroke-width="2" fill="none"/>
