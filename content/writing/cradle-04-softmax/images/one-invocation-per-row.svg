<text x="544.0" y="349.84" font-size="26" fill="#9b7028" text-anchor="middle" font-weight="700">0</text>
<rect x="608" y="314" width="108" height="54" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="662.0" y="349.84" font-size="26" fill="#9b7028" text-anchor="middle" font-weight="700">0</text>
<rect x="726" y="314" width="108" height="54" rx="7" fill="#efe1ba" stroke="#9b7028" stroke-width="1.5"/>
<text x="780.0" y="349.84" font-size="26" fill="#9b7028" text-anchor="middle" font-weight="700">0</text>
<text x="488" y="407" font-size="21" fill="#172f46" text-anchor="start" font-weight="700">Pass 1: exponentiate and add</text>
