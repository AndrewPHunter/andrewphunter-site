<text x="344.0" y="454.48" font-size="22" fill="#167779" text-anchor="middle" font-weight="700">20.086</text>
<text x="52" y="502" font-size="22" fill="#167779" text-anchor="start" font-weight="700">This row’s sum ≈ 30.1929</text>
<text x="52" y="540" font-size="21" fill="#172f46" text-anchor="start" font-weight="700">Pass 2: divide by this sum</text>
<rect x="54" y="555" width="108" height="44" rx="7" fill="#d9eeeb" stroke="#167779" stroke-width="1.5"/>
<text x="108.0" y="584.48" font-size="22" fill="#167779" text-anchor="middle" font-weight="700">.0900</text>
