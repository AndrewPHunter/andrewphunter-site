<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="864pt" height="576pt" viewBox="0 0 864 576" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-labelledby="exp-title exp-desc">
<title id="exp-title">The exponential gives larger scores more weight</title>
<desc id="exp-desc">The curve exp(x) for logits from minus three to three stays positive and passes through zero,one. Marked values are exp(-2) about .1353, exp(0) equal to 1, exp(1) about 2.7183, exp(2) about 7.3891 and exp(3) about 20.0855. Each one-point increase in score multiplies the amount by about 2.718. The vertical axis shows amounts before normalization, not probabilities.</desc>
