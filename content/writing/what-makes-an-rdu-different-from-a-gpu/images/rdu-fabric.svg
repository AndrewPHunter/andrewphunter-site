<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 744" role="img" aria-labelledby="title desc">
<title id="title">A conceptual RDU fabric</title><desc id="desc">Compute units and local memory units connect through switches. An interface brings in external-memory data. This illustrative fragment shows a selected producer-to-consumer path, not the physical SN40L floorplan.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="744" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="29" fill="#172f46" text-anchor="start" font-weight="700">Compute, memory, and routes</text><text x="30" y="79" font-size="23" fill="#536475" text-anchor="start" font-weight="400">The compiler assigns resources across the fabric</text><rect x="197" y="110" width="326" height="69" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="154" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">External memory</text><rect x="197" y="219" width="326" height="69" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="260" font-size="25" fill="#172f46" text-anchor="middle" font-weight="400">Memory interface</text><path d="M360,184 L360,212" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="25" y="325" width="670" height="303" rx="4" fill="#fff" stroke="#c8c8bc" stroke-width="1.5"/><text x="45" y="358" font-size="20" fill="#536475" text-anchor="start" font-weight="400">A SMALL PART OF THE RDU</text><rect x="50" y="394" width="160" height="65" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="130" y="435" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">PCU</text><rect x="280" y="394" width="160" height="65" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="435" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">PMU</text><rect x="510" y="394" width="160" height="65" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="590" y="435" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">PCU</text><rect x="50" y="530" width="160" height="65" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="130" y="571" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">PMU</text><rect x="280" y="530" width="160" height="65" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="571" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">PCU</text><rect x="510" y="530" width="160" height="65" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="590" y="571" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">PMU</text><path d="M130,460 V528" stroke="#536475" stroke-width="3"/><rect x="122" y="486" width="16" height="16" rx="1" fill="#f3e4bc" stroke="#536475" stroke-width="1.5"/><path d="M360,460 V528" stroke="#536475" stroke-width="3"/><rect x="352" y="486" width="16" height="16" rx="1" fill="#f3e4bc" stroke="#536475" stroke-width="1.5"/><path d="M590,460 V528" stroke="#536475" stroke-width="3"/><rect x="582" y="486" width="16" height="16" rx="1" fill="#f3e4bc" stroke="#536475" stroke-width="1.5"/><path d="M130,494 H590" stroke="#536475" stroke-width="3"/><path d="M360,289 L360,388" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M210,426 L246,426 L246,494 L360,494 L360,524" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="677" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">PCUs compute. PMUs hold the working data.</text><text x="30" y="713" font-size="22" fill="#172f46" text-anchor="start" font-weight="400">Configured switches connect producers and consumers.</text></g></svg>
