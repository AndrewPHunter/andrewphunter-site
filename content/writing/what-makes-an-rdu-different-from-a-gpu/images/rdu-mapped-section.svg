<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 645" role="img" aria-labelledby="title desc">
<title id="title">A spatial mapping with compute stages and local buffers</title><desc id="desc">Two matrix stages receive weights from HBM. An activation stage and on-chip buffers connect them. The mapping is illustrative, not the entire model. Boxes inside stages represent assigned compute units.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="645" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="29" fill="#172f46" text-anchor="start" font-weight="700">Map a section onto connected units</text><text x="30" y="77" font-size="23" fill="#536475" text-anchor="start" font-weight="400">A conceptual placement, not a compiler trace</text><rect x="120" y="110" width="480" height="78" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="143" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">HBM</text><text x="360" y="173" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Weight tiles for both matrix stages</text><rect x="28" y="241" width="664" height="296" rx="4" fill="#ffffff" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="278" font-size="20" fill="#536475" text-anchor="middle" font-weight="400">ONE MAPPED SECTION</text><path d="M180,188 L180,216 L130,216 L130,305" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M540,188 L540,216 L590,216 L590,305" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="50" y="310" width="154" height="130" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="127" y="347" font-size="24" fill="#172f46" text-anchor="middle" font-weight="700">Matrix 1</text><rect x="72" y="363" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="133" y="363" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="72" y="392" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="133" y="392" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="283" y="310" width="154" height="130" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="347" font-size="24" fill="#172f46" text-anchor="middle" font-weight="700">Activation</text><rect x="305" y="363" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="366" y="363" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="516" y="310" width="154" height="130" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="593" y="347" font-size="24" fill="#172f46" text-anchor="middle" font-weight="700">Matrix 2</text><rect x="538" y="363" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="599" y="363" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="538" y="392" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="599" y="392" width="48" height="21" rx="1" fill="#ffffff" stroke="#536475" stroke-width="1.5"/><rect x="229" y="346" width="16" height="61" rx="1" fill="#f3e4bc" stroke="#9d7c31" stroke-width="1.5"/><path d="M208,376 L227,376" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M247,376 L275,376" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="462" y="346" width="16" height="61" rx="1" fill="#f3e4bc" stroke="#9d7c31" stroke-width="1.5"/><path d="M441,376 L460,376" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M480,376 L508,376" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="360" y="485" font-size="24" fill="#172f46" text-anchor="middle" font-weight="400">On-chip buffers connect the stages</text><text x="360" y="518" font-size="21" fill="#536475" text-anchor="middle" font-weight="400">Pieces of data flow as dependencies allow</text><text x="30" y="582" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">The compiler assigns compute, buffers, and routes.</text><text x="30" y="617" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Larger computations can use successive sections.</text></g></svg>
