<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 699" role="img" aria-labelledby="title desc">
<title id="title">GPU software targets fixed execution hardware</title><desc id="desc">Kernel source compiles into machine instructions. Scheduling issues work to arithmetic lanes and specialized matrix hardware. This is a conceptual view, not a specific GPU block diagram.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="699" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="29" fill="#172f46" text-anchor="start" font-weight="700">The GPU executes an instruction stream</text><text x="30" y="78" font-size="23" fill="#536475" text-anchor="start" font-weight="400">Different kernels reuse the same hardware</text><rect x="45" y="110" width="260" height="92" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="175" y="147" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">Kernel source</text><text x="175" y="181" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">Our program</text><path d="M313,156 L388,156" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="400" y="110" width="275" height="92" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="537" y="147" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">Machine code</text><text x="537" y="181" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Load · multiply · add…</text><rect x="30" y="248" width="660" height="340" rx="4" fill="#ffffff" stroke="#c8c8bc" stroke-width="1.5"/><text x="52" y="283" font-size="20" fill="#536475" text-anchor="start" font-weight="400">INSIDE THE GPU</text><rect x="202" y="311" width="316" height="65" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="352" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Instruction scheduling</text><path d="M537,203 L537,225 L360,225 L360,303" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M280,377 L280,399 L185,399 L185,423" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M440,377 L440,399 L535,399 L535,423" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="430" width="270" height="122" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="190" y="465" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Arithmetic lanes</text><rect x="390" y="430" width="275" height="122" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="527" y="465" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Matrix hardware</text><text x="527" y="508" font-size="21" fill="#172f46" text-anchor="middle" font-weight="400">Multiply + accumulate</text><rect x="73" y="487" width="46" height="40" rx="4" fill="#fff" stroke="#536475" stroke-width="1.5"/><text x="96" y="515" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">×</text><rect x="134" y="487" width="46" height="40" rx="4" fill="#fff" stroke="#536475" stroke-width="1.5"/><text x="157" y="515" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">×</text><rect x="195" y="487" width="46" height="40" rx="4" fill="#fff" stroke="#536475" stroke-width="1.5"/><text x="218" y="515" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">×</text><rect x="256" y="487" width="46" height="40" rx="4" fill="#fff" stroke="#536475" stroke-width="1.5"/><text x="279" y="515" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">×</text><text x="30" y="634" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Registers and local memory supply the operands.</text><text x="30" y="669" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Instructions select what the hardware does next.</text></g></svg>
