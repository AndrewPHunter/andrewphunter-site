<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 644" role="img" aria-labelledby="title desc">
<title id="title">Changing a LUT truth table changes its function</title><desc id="desc">A conceptual two-input LUT. Inputs 00, 01, 10, and 11 select four stored bits. AND uses 0 0 0 1; XOR uses 0 1 1 0.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="644" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="28" fill="#172f46" text-anchor="start" font-weight="700">A lookup table implements a logic function</text><text x="30" y="78" font-size="23" fill="#536475" text-anchor="start" font-weight="400">Two inputs select one of four stored output bits</text><rect x="210" y="112" width="300" height="84" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="147" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">Input bits A and B</text><text x="360" y="178" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Select a row below</text><path d="M360,202 L360,237" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="132" y="278" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">Inputs</text><text x="355" y="278" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">AND table</text><text x="573" y="278" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">XOR table</text><rect x="42" y="302" width="180" height="48" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="132" y="335" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">00</text><rect x="265" y="302" width="180" height="48" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="355" y="335" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">0</text><rect x="483" y="302" width="180" height="48" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="573" y="335" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">0</text><rect x="42" y="360" width="180" height="48" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="132" y="393" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">01</text><rect x="265" y="360" width="180" height="48" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="355" y="393" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">0</text><rect x="483" y="360" width="180" height="48" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="573" y="393" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">1</text><rect x="42" y="418" width="180" height="48" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="132" y="451" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">10</text><rect x="265" y="418" width="180" height="48" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="355" y="451" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">0</text><rect x="483" y="418" width="180" height="48" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="573" y="451" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">1</text><rect x="42" y="476" width="180" height="48" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="132" y="509" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">11</text><rect x="265" y="476" width="180" height="48" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="355" y="509" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">1</text><rect x="483" y="476" width="180" height="48" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="573" y="509" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">0</text><text x="30" y="575" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Load a different table, get a different logic function.</text><text x="30" y="612" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">The LUT hardware itself stays in place.</text></g></svg>
