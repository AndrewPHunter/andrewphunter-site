<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 588" role="img" aria-labelledby="title desc">
<title id="title">Different inputs occupy a configured pipeline</title><desc id="desc">Multiply, add, and clamp are configured stages. Input A advances through them while inputs B and C follow. Each input retains its order of operations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="588" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="28" fill="#172f46" text-anchor="start" font-weight="700">Configure the stages and their connections</text><text x="30" y="78" font-size="23" fill="#536475" text-anchor="start" font-weight="400">Example: multiply → add → clamp</text><rect x="142" y="116" width="155" height="65" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="219.5" y="157" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">Multiply</text><rect x="332" y="116" width="155" height="65" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="409.5" y="157" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">Add</text><rect x="522" y="116" width="155" height="65" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="599.5" y="157" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">Clamp</text><path d="M300,148 L327,148" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M490,148 L517,148" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="225" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">The stages stay in place as independent inputs move.</text><text x="30" y="291" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Step 1</text><rect x="142" y="254" width="155" height="58" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="219.5" y="291" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Input A</text><rect x="332" y="254" width="155" height="58" rx="4" fill="#f1f0e9" stroke="#c8c8bc" stroke-width="1.5"/><rect x="522" y="254" width="155" height="58" rx="4" fill="#f1f0e9" stroke="#c8c8bc" stroke-width="1.5"/><text x="30" y="367" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Step 2</text><rect x="142" y="330" width="155" height="58" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="219.5" y="367" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Input B</text><rect x="332" y="330" width="155" height="58" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="409.5" y="367" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Input A</text><rect x="522" y="330" width="155" height="58" rx="4" fill="#f1f0e9" stroke="#c8c8bc" stroke-width="1.5"/><text x="30" y="443" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Step 3</text><rect x="142" y="406" width="155" height="58" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="219.5" y="443" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Input C</text><rect x="332" y="406" width="155" height="58" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="409.5" y="443" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Input B</text><rect x="522" y="406" width="155" height="58" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="599.5" y="443" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Input A</text><text x="30" y="525" font-size="24" fill="#172f46" text-anchor="start" font-weight="400">By step 3, all three stages have work at once.</text><text x="30" y="559" font-size="21" fill="#536475" text-anchor="start" font-weight="400">Illustrative equal-duration stages, with registers between.</text></g></svg>
