<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 654" role="img" aria-labelledby="title desc">
<title id="title">Three memory tiers on the SN40L</title><desc id="desc">Attached DDR provides capacity, HBM feeds active computation, and distributed SRAM holds local working data. The arrows illustrate movement toward compute, not all supported memory routes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="654" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="27" fill="#172f46" text-anchor="start" font-weight="700">Capacity and working storage have different jobs</text><text x="30" y="78" font-size="22" fill="#536475" text-anchor="start" font-weight="400">SN40L memory per socket · diagram not to scale</text><rect x="45" y="116" width="630" height="112" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="68" y="155" font-size="27" fill="#172f46" text-anchor="start" font-weight="700">Attached DDR</text><text x="650" y="155" font-size="27" fill="#172f46" text-anchor="end" font-weight="700">Up to 1.5 TiB</text><text x="68" y="198" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Capacity for additional models and overflow</text><path d="M360,233 L360,269" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="45" y="274" width="630" height="112" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="68" y="313" font-size="27" fill="#172f46" text-anchor="start" font-weight="700">HBM</text><text x="650" y="313" font-size="27" fill="#172f46" text-anchor="end" font-weight="700">64 GiB</text><text x="68" y="356" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Feeds active computation</text><path d="M360,391 L360,427" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="45" y="432" width="630" height="112" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="68" y="471" font-size="27" fill="#172f46" text-anchor="start" font-weight="700">On-chip SRAM</text><text x="650" y="471" font-size="27" fill="#172f46" text-anchor="end" font-weight="700">520 MiB</text><text x="68" y="514" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Distributed buffers close to compute</text><text x="30" y="590" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">An 8B model at two bytes per weight is about 16 GB.</text><text x="30" y="626" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Its weights still have to stream through the processor.</text></g></svg>
