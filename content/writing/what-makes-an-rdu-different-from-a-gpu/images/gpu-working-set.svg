<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
<title id="title">Reusing GPU compute across kernels</title><desc id="desc">Weights stream from HBM. Three boxes show the same GPU hardware at successive times, not three separate processors. Adjacent operations can also be fused.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="650" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="29" fill="#172f46" text-anchor="start" font-weight="700">A GPU reuses its compute hardware</text><text x="30" y="77" font-size="22" fill="#536475" text-anchor="start" font-weight="400">A simplified sequence of separate kernels</text><rect x="50" y="110" width="620" height="90" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="148" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">HBM · model weights</text><text x="360" y="179" font-size="21" fill="#172f46" text-anchor="middle" font-weight="400">Much larger than the on-chip working space</text><text x="360" y="254" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">Pieces of weights move in</text><rect x="30" y="287" width="660" height="190" rx="4" fill="#ffffff" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="323" font-size="19" fill="#536475" text-anchor="middle" font-weight="400">SAME GPU, SUCCESSIVE WORK</text><path d="M138,200 L138,339" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M582,200 L582,339" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="52" y="346" width="172" height="95" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="138" y="382" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Matrix 1</text><text x="138" y="415" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">kernel</text><rect x="274" y="346" width="172" height="95" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="382" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Activation</text><text x="360" y="415" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">kernel</text><rect x="496" y="346" width="172" height="95" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="582" y="382" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Matrix 2</text><text x="582" y="415" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">kernel</text><path d="M229,392 L267,392" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M451,392 L489,392" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M50,513 L669,513" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="360" y="548" font-size="24" fill="#172f46" text-anchor="middle" font-weight="400">Execution over time →</text><text x="30" y="594" font-size="22" fill="#172f46" text-anchor="start" font-weight="400">Results pass through global memory or stay in cache.</text><text x="30" y="624" font-size="22" fill="#172f46" text-anchor="start" font-weight="400">Fusion can combine stages and keep more work local.</text></g></svg>
