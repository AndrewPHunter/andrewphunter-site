<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 796" role="img" aria-labelledby="title desc">
<title id="title">Memory configuration defines the order delivered to compute</title><desc id="desc">Six values a through f occupy addresses zero through five in two rows. Row traversal reads addresses zero, one, two, three, four, five. Column traversal reads zero, three, one, four, two, five. Configured address generation supplies the corresponding stream to compute.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="796" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="44" font-size="28" fill="#172f46" text-anchor="start" font-weight="700">Configure how memory feeds the calculation</text><text x="30" y="79" font-size="23" fill="#536475" text-anchor="start" font-weight="400">Same stored values · a different read sequence</text><rect x="40" y="110" width="640" height="246" rx="4" fill="#ffffff" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="147" font-size="20" fill="#536475" text-anchor="middle" font-weight="400">LOCAL MEMORY</text><rect x="164" y="174" width="112" height="66" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="220" y="203" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">a</text><text x="220" y="228" font-size="17" fill="#536475" text-anchor="middle" font-weight="400">address 0</text><rect x="304" y="174" width="112" height="66" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="203" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">b</text><text x="360" y="228" font-size="17" fill="#536475" text-anchor="middle" font-weight="400">address 1</text><rect x="444" y="174" width="112" height="66" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="500" y="203" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">c</text><text x="500" y="228" font-size="17" fill="#536475" text-anchor="middle" font-weight="400">address 2</text><rect x="164" y="254" width="112" height="66" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="220" y="283" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">d</text><text x="220" y="308" font-size="17" fill="#536475" text-anchor="middle" font-weight="400">address 3</text><rect x="304" y="254" width="112" height="66" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="283" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">e</text><text x="360" y="308" font-size="17" fill="#536475" text-anchor="middle" font-weight="400">address 4</text><rect x="444" y="254" width="112" height="66" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="500" y="283" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">f</text><text x="500" y="308" font-size="17" fill="#536475" text-anchor="middle" font-weight="400">address 5</text><path d="M220,356 L220,392 L190,392 L190,418" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M500,356 L500,392 L530,392 L530,418" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="40" y="426" width="300" height="225" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="190" y="463" font-size="21" fill="#172f46" text-anchor="middle" font-weight="700">READ ACROSS ROWS</text><text x="190" y="500" font-size="20" fill="#536475" text-anchor="middle" font-weight="400">Address sequence</text><text x="190" y="535" font-size="25" fill="#172f46" text-anchor="middle" font-weight="400">0 → 1 → 2</text><text x="190" y="569" font-size="25" fill="#172f46" text-anchor="middle" font-weight="400">3 → 4 → 5</text><text x="190" y="622" font-size="29" fill="#172f46" text-anchor="middle" font-weight="700">a b c d e f</text><rect x="380" y="426" width="300" height="225" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="530" y="463" font-size="21" fill="#172f46" text-anchor="middle" font-weight="700">READ DOWN COLUMNS</text><text x="530" y="500" font-size="20" fill="#536475" text-anchor="middle" font-weight="400">Address sequence</text><text x="530" y="535" font-size="25" fill="#172f46" text-anchor="middle" font-weight="400">0 → 3 → 1</text><text x="530" y="569" font-size="25" fill="#172f46" text-anchor="middle" font-weight="400">4 → 2 → 5</text><text x="530" y="622" font-size="29" fill="#172f46" text-anchor="middle" font-weight="700">a d b e c f</text><text x="30" y="698" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">The PMU generates addresses and delivers the stream.</text><text x="30" y="734" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Compute receives values in the order its work needs.</text><text x="30" y="771" font-size="21" fill="#536475" text-anchor="start" font-weight="400">Conceptual layout; physical banking is omitted.</text></g></svg>
