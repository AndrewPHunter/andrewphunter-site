<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 856" role="img" aria-labelledby="title desc">
<title id="title">Choose an operation and its data path</title><desc id="desc">A conceptual arithmetic block receives two and three. Ready-made addition produces five; multiplication produces six. Stored configuration selects the inputs and the result forwarded to the next stage. This illustrates configuration, not the physical circuit design of a PCU.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="856" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="44" font-size="27" fill="#172f46" text-anchor="start" font-weight="700">Configuration chooses a path through arithmetic</text><text x="30" y="79" font-size="22" fill="#536475" text-anchor="start" font-weight="400">Conceptual block · the arithmetic is already built</text><rect x="170" y="112" width="380" height="58" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="149" font-size="26" fill="#172f46" text-anchor="middle" font-weight="700">Input values: 2 and 3</text><path d="M360,176 L360,208" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="170" y="216" width="380" height="57" rx="4" fill="#ffffff" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="252" font-size="24" fill="#172f46" text-anchor="middle" font-weight="400">Select inputs</text><path d="M270,273 L270,302 L180,302 L180,330" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M450,273 L450,302 L540,302 L540,330" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="70" y="338" width="220" height="84" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="180" y="372" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">ADD</text><text x="180" y="404" font-size="24" fill="#172f46" text-anchor="middle" font-weight="400">2 + 3 = 5</text><rect x="430" y="338" width="220" height="84" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="540" y="372" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">MULTIPLY</text><text x="540" y="404" font-size="24" fill="#172f46" text-anchor="middle" font-weight="400">2 × 3 = 6</text><path d="M180,422 L180,453 L270,453 L270,479" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M540,422 L540,453 L450,453 L450,479" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="170" y="487" width="380" height="62" rx="4" fill="#ffffff" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="526" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">Select the result to forward</text><path d="M360,555 L360,590" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="360" y="627" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Output to the next stage</text><rect x="30" y="658" width="660" height="100" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="50" y="696" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Configuration A: select addition → output 5</text><text x="50" y="735" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Configuration B: select multiplication → output 6</text><text x="30" y="798" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Stored configuration controls the selections.</text><text x="30" y="831" font-size="21" fill="#536475" text-anchor="start" font-weight="400">This illustrates the idea, not the PCU’s circuit layout.</text></g></svg>
