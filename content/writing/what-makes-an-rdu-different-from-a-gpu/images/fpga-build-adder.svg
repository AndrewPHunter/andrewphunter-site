<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 723" role="img" aria-labelledby="title desc">
<title id="title">From one-bit logic to a wider adder</title><desc id="desc">XOR computes the sum bit and AND the carry for a half adder. Full adders also accept incoming carry. Four full-adder stages illustrate a wider addition. Modern FPGAs supply optimized carry paths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="723" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="29" fill="#172f46" text-anchor="start" font-weight="700">Compose logic into arithmetic</text><text x="30" y="80" font-size="24" fill="#536475" text-anchor="start" font-weight="400">Start with adding two single bits</text><rect x="45" y="115" width="152" height="130" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="121" y="158" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Inputs</text><text x="121" y="201" font-size="28" fill="#172f46" text-anchor="middle" font-weight="400">A and B</text><rect x="285" y="108" width="165" height="64" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="367" y="149" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">XOR</text><rect x="285" y="205" width="165" height="64" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="367" y="246" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">AND</text><path d="M198,153 L237,153 L237,140 L278,140" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M198,211 L237,211 L237,237 L278,237" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M457,140 L524,140" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M457,237 L524,237" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="548" y="149" font-size="27" fill="#172f46" text-anchor="start" font-weight="700">Sum</text><text x="548" y="246" font-size="27" fill="#172f46" text-anchor="start" font-weight="700">Carry</text><text x="30" y="320" font-size="24" fill="#172f46" text-anchor="start" font-weight="400">Accept an incoming carry: a full-adder stage.</text><text x="30" y="356" font-size="24" fill="#172f46" text-anchor="start" font-weight="400">Connect stages to add wider numbers.</text><rect x="38" y="400" width="133" height="111" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="104" y="437" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Bit 0</text><text x="104" y="476" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Full adder</text><path d="M175,457 L203,457" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="211" y="400" width="133" height="111" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="277" y="437" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Bit 1</text><text x="277" y="476" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Full adder</text><path d="M348,457 L376,457" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="384" y="400" width="133" height="111" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="450" y="437" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Bit 2</text><text x="450" y="476" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Full adder</text><path d="M521,457 L549,457" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="557" y="400" width="133" height="111" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="623" y="437" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Bit 3</text><text x="623" y="476" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Full adder</text><text x="360" y="552" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">Carry advances from the low bit to the high bit</text><rect x="74" y="585" width="572" height="65" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="627" font-size="25" fill="#172f46" text-anchor="middle" font-weight="400">Registers can hold the resulting sum</text><text x="30" y="693" font-size="22" fill="#172f46" text-anchor="start" font-weight="400">FPGA tools can use built-in carry chains for this path.</text></g></svg>
