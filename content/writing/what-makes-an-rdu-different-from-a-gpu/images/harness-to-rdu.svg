<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 858" role="img" aria-labelledby="title desc">
<title id="title">The model mapping is one part of an inference harness</title><desc id="desc">Host-side request and generation control invokes compiled RDU sections. Those sections use device memory for weights and KV state. Generation selects another token until a stopping condition is met. Sampling may be on the host or device.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="858" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="28" fill="#172f46" text-anchor="start" font-weight="700">The harness invokes mapped computation</text><rect x="35" y="88" width="650" height="114" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="128" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">Host-side generation control</text><text x="360" y="169" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Requests · tokenization · scheduling · stopping</text><path d="M360,208 L360,254" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="390" y="238" font-size="22" fill="#172f46" text-anchor="start" font-weight="400">Invoke model</text><rect x="35" y="265" width="650" height="331" rx="4" fill="#fff" stroke="#c8c8bc" stroke-width="1.5"/><text x="57" y="304" font-size="22" fill="#172f46" text-anchor="start" font-weight="700">RDU EXECUTION</text><rect x="72" y="329" width="576" height="62" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="369" font-size="24" fill="#172f46" text-anchor="middle" font-weight="400">Weights and KV state in device memory</text><rect x="72" y="438" width="265" height="109" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="204" y="478" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Mapped section</text><text x="204" y="515" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Compute + buffers</text><rect x="391" y="438" width="257" height="109" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="520" y="478" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Next section</text><text x="520" y="515" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Reuse / reconfigure</text><path d="M204,398 L204,431" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M520,398 L520,431" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M343,491 L384,491" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="360" y="577" font-size="21" fill="#172f46" text-anchor="middle" font-weight="400">Sections cover the model’s layers and operations</text><path d="M360,603 L360,649" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="88" y="660" width="544" height="88" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="697" font-size="25" fill="#172f46" text-anchor="middle" font-weight="700">Select token · check stopping rule</text><text x="360" y="729" font-size="22" fill="#172f46" text-anchor="middle" font-weight="400">Continue generation with the selected token</text><text x="30" y="794" font-size="22" fill="#172f46" text-anchor="start" font-weight="400">Sampling placement depends on the implementation.</text><text x="30" y="828" font-size="22" fill="#172f46" text-anchor="start" font-weight="400">The model mapping sits inside a larger software loop.</text></g></svg>
