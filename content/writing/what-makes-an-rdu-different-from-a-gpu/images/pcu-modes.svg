<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 735" role="img" aria-labelledby="title desc">
<title id="title">Two conceptual operating modes of a Pattern Compute Unit</title><desc id="desc">A vector pipeline performs operations across lanes. A systolic matrix array passes values through multiply-accumulate cells. These are selectable PCU modes, not FPGA truth tables or exact unit dimensions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="735" fill="#fbf8f0" rx="6"/>
