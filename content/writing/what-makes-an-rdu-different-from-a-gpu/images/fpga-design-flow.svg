<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 724" role="img" aria-labelledby="title desc">
<title id="title">HDL becomes a configuration for a physical circuit</title><desc id="desc">Synthesis selects resources. Placement and routing assign and connect them. Timing checks validate signal paths. The resulting bitstream configures the FPGA.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#536475"/></marker></defs>
<rect width="720" height="724" fill="#fbf8f0" rx="6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="29" fill="#172f46" text-anchor="start" font-weight="700">From an HDL description to a circuit</text><rect x="55" y="88" width="610" height="111" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="129" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">HDL + constraints</text><text x="360" y="170" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">Describe logic, registers, and timing</text><path d="M360,205 L360,232" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="238" width="610" height="111" rx="4" fill="#dcece6" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="279" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">Synthesize</text><text x="360" y="320" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">Choose logic and storage resources</text><path d="M360,355 L360,382" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="388" width="610" height="111" rx="4" fill="#f3e4bc" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="429" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">Place, route, and check timing</text><text x="360" y="470" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">Assign sites and connect real paths</text><path d="M360,505 L360,532" stroke="#536475" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="538" width="610" height="111" rx="4" fill="#e5edf3" stroke="#c8c8bc" stroke-width="1.5"/><text x="360" y="579" font-size="27" fill="#172f46" text-anchor="middle" font-weight="700">Load the bitstream</text><text x="360" y="620" font-size="23" fill="#172f46" text-anchor="middle" font-weight="400">Configure the FPGA for this circuit</text><text x="30" y="696" font-size="23" fill="#172f46" text-anchor="start" font-weight="400">Finding a placement that meets timing takes work.</text></g></svg>
