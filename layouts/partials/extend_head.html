{{- /* Adds optional KaTeX math rendering on pages that opt in via front matter: `math: true`. */ -}}
{{- if .Params.math -}}
  <link rel="stylesheet" href="{{ "/katex/katex.min.css" | absURL }}">
  <script defer src="{{ "/katex/katex.min.js" | absURL }}"></script>
  <script defer src="{{ "/katex/contrib/auto-render.min.js" | absURL }}"></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof renderMathInElement !== "function") return;
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false }
        ],
        ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      });
    });
  </script>
{{- end -}}
